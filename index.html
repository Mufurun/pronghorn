<!DOCTYPE html>
<html>
<head>
  <title>World Map with Real-Time Comments</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel = "stylesheet" href = "styles.css" />
</head>
<body>

<div id="map"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Data for the sites -->
<script src="data.js"></script>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
  
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
  apiKey: "AIzaSyBzWuvmEKysIWChuS4ktZHsOuuknv2fuOU",
  authDomain: "pronghorn-5f357.firebaseapp.com",
  projectId: "pronghorn-5f357",
  databaseURL: "https://pronghorn-5f357-default-rtdb.firebaseio.com/",
  storageBucket: "pronghorn-5f357.firebasestorage.app",
  messagingSenderId: "10063193837",
  appId: "1:10063193837:web:e513d28105eb8b41a80ee4",
  measurementId: "G-M7FMSS1P71"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    console.log(db);
    console.log("Firebase initialized ✅");
    


    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
  
    
  
    // Create popup content and listeners
    function createPopupContent(point) {
      const container = document.createElement('div');
      container.className = 'popup-content';
  
      const title = document.createElement('strong');
      title.textContent = point.name;
      container.appendChild(title);
      
      const image = new Image(250, 125);
      image.src= point.image;
      container.appendChild(document.body.appendChild(image));

      const commentsDiv = document.createElement('div');
      commentsDiv.id = `comments-${point.id}`;
      commentsDiv.className = 'comments';
      commentsDiv.innerHTML = "<i>Loading comments...</i>";
      container.appendChild(commentsDiv);
  
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Add a comment';
      input.style.width = '90%';
      input.id = `input-${point.id}`;
  
      const button = document.createElement('button');
      button.textContent = 'Post';
      button.onclick = () => {
        const comment = input.value.trim();
        if (comment) {
          db.ref(`comments/${point.id}`).push({
            text: comment,
            timestamp: Date.now()
          });
          input.value = '';
        }
      };
  
      const box = document.createElement('div');
      box.className = 'comment-box';
      box.appendChild(input);
      box.appendChild(button);
      container.appendChild(box);
  
      // Listen for comments in real time
      const commentsRef = db.ref(`comments/${point.id}`);
      commentsRef.on('value', (snapshot) => {
        const comments = snapshot.val();
        commentsDiv.innerHTML = '';
        if (comments) {
          Object.values(comments).forEach(c => {
            const div = document.createElement('div');
            div.textContent = `• ${c.text}`;
            commentsDiv.appendChild(div);
          });
        } else {
          commentsDiv.innerHTML = "<i>No comments yet.</i>";
        }
      });
  
      return container;
    }
  
    points.forEach(point => {
      const marker = L.marker(point.coords).addTo(map);
      marker.on('click', () => {
        const popupContent = createPopupContent(point);
        marker.bindPopup(popupContent).openPopup();
      });
    });
</script>


</body>
</html>
