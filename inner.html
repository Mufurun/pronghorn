<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.collapsible {
  background-color: #777;
  color: white;
  cursor: pointer;
  padding: 18px;
  width: 100%;
  border: none;
  text-align: left;
  outline: none;
  font-size: 15px;
}

.active, .collapsible:hover {
  background-color: #555;
}

.collapsible:after {
  content: '\002B';
  color: white;
  font-weight: bold;
  float: right;
  margin-left: 5px;
}

.active:after {
  content: "\2212";
}

.content {
  padding: 0 18px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s ease-out;
  background-color: #f1f1f1;
}
</style>
</head>
<body>

</div>

<script>
    function updateParentHeight(element) {
      let parent = element.parentElement;
      while (parent) {
        if (parent.classList.contains('content') && parent.style.maxHeight) {
        parent.style.maxHeight = 400 +" px";
        }
        parent = parent.parentElement;
      }
    }

    
    function updateSibling(element) {
        let sibling = element.parentElement.firstElementChild;
        while (sibling) {
            if (sibling !== element && sibling.classList.contains("content") && sibling.style.maxHeight) {
                sibling.style.maxHeight = null;
                updateChildren(sibling);
            }
            sibling = sibling.nextElementSibling;
        }
    }
    function updateChildren(element) {
        let child = element.firstElementChild;
        while (child) {
            if (child.classList.contains("content") && child.style.maxHeight) {
                child.style.maxHeight = null;
            }
            child = child.nextElementSibling;
        }
    }
  
    const collapsibles = document.querySelectorAll(".collapsible");
    collapsibles.forEach(button => {
      button.addEventListener("click", function () {
        this.classList.toggle("active");
        const content = this.nextElementSibling;
        if (content.style.maxHeight) {
          content.style.maxHeight = null;
          updateChildren(content);
          
        } else {
          content.style.maxHeight = 400 + "px";
          updateSibling(content);
          setTimeout(() => {
          updateParentHeight(content);
        }, 0);
          
        }
      });
    });

    
  </script>

</body>
